<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ellie Custom Gifts — Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6f533d">
<link rel="icon" href="elephant.png">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Archivo+Black&family=Poppins:wght@700&family=Chewy&family=Pacifico&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0ec; --card:#fff; --brown:#6f533d; --brown-d:#563f2d; --brown-l:#a88c74; --line:#e6ddd5;
  --ink:#3b2f26; --muted:#8a7a6d; --red:#b3262e; --green:#2f7a45; --amber:#c98a1a; --blue:#3a6ea5;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brown)}
.hand{font-family:"Patrick Hand",cursive;font-weight:400}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);border-radius:22px;padding:34px 30px;width:min(380px,100%);box-shadow:0 20px 50px -20px rgba(86,63,45,.35);text-align:center}
.login-card img{width:200px;margin:0 auto 6px}
.login-card h1{font-family:"Patrick Hand",cursive;font-weight:400;font-size:28px;color:var(--brown-d);margin-bottom:16px}
.login-card form{display:flex;flex-direction:column;gap:10px;text-align:left}
.login-card .err{color:var(--red);font-size:13px;min-height:18px}

/* layout */
.top{background:var(--brown-d);color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:18px;height:62px}
.top .brand{display:flex;align-items:center;gap:10px;font-family:"Patrick Hand",cursive;font-size:24px;white-space:nowrap}
.top .brand img{height:34px;filter:brightness(0) invert(1)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs button{padding:8px 14px;border-radius:999px;font-weight:700;color:#e9dfd6;white-space:nowrap;position:relative}
.tabs button.on{background:#fff;color:var(--brown-d)}
.tabs .dot{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.top .right{display:flex;gap:8px;align-items:center}
.top .right a,.top .right button{color:#fff;font-weight:700;font-size:13px;text-decoration:none;padding:7px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;white-space:nowrap}
.demo-bar{background:#fff4dc;color:#7a5410;text-align:center;font-size:13px;padding:7px 12px;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:24px 18px 80px}
h2.title{font-family:"Patrick Hand",cursive;font-weight:400;font-size:34px;color:var(--brown-d);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;flex-wrap:wrap}
p.sub{color:var(--muted);margin-bottom:18px;font-size:14px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--brown);color:#fff;transition:background .15s}
.btn:hover{background:var(--brown-d)}
.btn.ghost{background:#fff;color:var(--brown);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--brown-l)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none;width:100%;font-size:14px}
.inp:focus{border-color:var(--brown)}
textarea.inp{resize:vertical;min-height:60px}
label.fl{display:block;font-size:12px;font-weight:800;color:var(--brown);margin-bottom:4px}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:#d8cdc3;position:relative;transition:background .2s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:19px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:16px}
.grid{display:grid;gap:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:26px;color:var(--brown-d);line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}

/* orders */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.filters .inp{max-width:240px;margin-left:auto}
.order{margin-bottom:12px}
.order-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
.order-head .oid{font-weight:800;color:var(--brown-d);font-size:16px;letter-spacing:.03em}
.order-head .who{flex:1;min-width:160px}
.order-head .who small{display:block;color:var(--muted);font-size:12.5px}
.order-head .amt{font-weight:800;font-size:17px;color:var(--brown-d)}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.st-New{background:#fde8e8;color:var(--red)} .st-Confirmed{background:#e6eefb;color:var(--blue)} .st-Printing{background:#fff1d9;color:var(--amber)}
.st-Ready{background:#e3f4e8;color:var(--green)} .st-Completed{background:#eee;color:#666} .st-Cancelled{background:#eee;color:#999;text-decoration:line-through}
.paid{background:#e3f4e8;color:var(--green)} .unpaid{background:#fff1d9;color:var(--amber)}
.order-body{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:#faf7f4;border-radius:12px;padding:8px 10px}
.it svg{width:56px;height:auto}
.it h4{font-size:15px;color:var(--brown-d)}
.it .d{font-size:12.5px;color:var(--muted)}
.it .q{font-weight:800;text-align:right;white-space:nowrap}
.kv{font-size:14px;display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin-bottom:12px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{word-break:break-word}
.tot .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px}
.tot .row.big{font-weight:800;font-size:16px;color:var(--brown-d);border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.empty img{width:90px;margin:0 auto 10px;opacity:.6}

/* editable lists */
.list{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}
.prow .thumb{width:84px;height:84px;background:#faf7f4;border-radius:12px;display:grid;place-items:center;padding:6px}
.prow .thumb svg{width:100%;height:100%}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.toggles{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row-tools{display:flex;gap:6px;margin-left:auto;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--brown);font-weight:800;display:inline-grid;place-items:center}
.icon-btn:hover{border-color:var(--brown-l)}
.icon-btn.del:hover{color:var(--red);border-color:var(--red)}
.tag{font-size:11.5px;font-weight:800;background:#f1ebe5;color:var(--brown);border-radius:999px;padding:3px 9px}
.inactive{opacity:.55}
.crow{display:grid;grid-template-columns:52px 1.4fr 1fr 1fr .7fr auto;gap:10px;align-items:center}
.crow input[type=color]{width:52px;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:3px;background:#fff;cursor:pointer}
.ctoggles{grid-column:2/-1;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.add-panel{background:#fbf8f5;border:2px dashed var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.add-panel h3{font-size:16px;color:var(--brown-d);margin-bottom:10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;color:var(--red)}

/* settings */
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fontpick.f3{grid-template-columns:repeat(3,1fr)}
.fopt{border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;background:#fff;color:var(--brown-d)}
.fopt.on{border-color:var(--brown);background:#fbf8f5}
.fopt input{display:none}
.fopt small{font-size:11.5px;color:var(--muted);font-weight:700}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-grid .card h3{font-size:16px;color:var(--brown-d);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.set-grid .card .grid{grid-template-columns:1fr 1fr}
.set-grid .card .full{grid-column:1/-1}
.help{font-size:12.5px;color:var(--muted);margin-top:4px}
.savebar{position:sticky;bottom:14px;display:flex;justify-content:flex-end;margin-top:16px}
.savebar .btn{box-shadow:0 10px 24px -8px rgba(86,63,45,.6);padding:12px 26px;font-size:15px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--brown-d);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:70;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(59,47,38,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal .card{width:min(560px,100%)}

@media (max-width:860px){
  .stats{grid-template-columns:1fr 1fr}
  .order-body{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr}
  .set-grid{grid-template-columns:1fr}
  .crow{grid-template-columns:52px 1fr 1fr}
  .crow .cost,.crow .brand{display:none}
  .top .brand span{display:none}
}
@media (max-width:520px){
  .fields,.set-grid .card .grid{grid-template-columns:1fr}
  .prow{grid-template-columns:64px 1fr}
  .prow .thumb{width:64px;height:64px}
  .filters .inp{max-width:none;margin-left:0}
}
</style>
</head>
<body>

<!-- LOGIN (Firebase mode) -->
<div class="login" id="login" hidden>
  <div class="login-card">
    <img src="logo_h.png" alt="Ellie Custom Gifts">
    <h1>Shop admin</h1>
    <form id="loginForm">
      <div><label class="fl" for="lEmail">Email</label><input class="inp" id="lEmail" type="email" autocomplete="username" required></div>
      <div><label class="fl" for="lPass">Password</label><input class="inp" id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="lErr"></div>
      <button class="btn" type="submit" style="justify-content:center">Sign in</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="top"><div class="in">
    <div class="brand"><img src="elephant.png" alt=""><span>Admin</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="orders" class="on">Orders<span class="dot" id="newDot" hidden></span></button>
      <button data-tab="products">Products</button>
      <button data-tab="colours">Colours &amp; filament</button>
      <button data-tab="scenes">Scenes</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="right"><a href="index.html" target="_blank" rel="noopener">View shop ↗</a><button id="logout">Sign out</button></div>
  </div></div>
  <div class="demo-bar" id="demoBar" hidden>Demo mode: changes are saved in this browser only. Add your Firebase details to shared.js to go live.</div>
  <main>
    <section id="tab-orders"></section>
    <section id="tab-products" hidden></section>
    <section id="tab-colours" hidden></section>
    <section id="tab-scenes" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script src="shared.js"></script>
<script>
/* =========================================================
   ADMIN PAGE
   ========================================================= */
const $ = s => document.querySelector(s);
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2000); }
const fmtDate = iso => { try{ return new Date(iso).toLocaleString("en-AU", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" }); }catch(e){ return iso; } };
const num = v => v === "" || v == null || isNaN(Number(v)) ? null : Math.round(Number(v) * 100) / 100;
async function safe(fn, ok = "Saved"){ try{ await fn(); if(ok) toast(ok); return true; }catch(e){ console.error(e); toast("Couldn't save: " + (e.message || "check your connection")); return false; } }

/* ---------- tabs ---------- */
let tab = "orders";
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== "tab-" + tab);
  render();
});
function render(){ ({ orders: renderOrders, products: renderProducts, colours: renderColours, scenes: renderScenes, settings: renderSettings })[tab](); }

/* =========================================================
   ORDERS
   ========================================================= */
let orders = [], ofilter = "Open", osearch = "", openIds = new Set();
async function loadOrders(){ orders = await DB.listOrders(); const n = orders.filter(o => o.status === "New").length; $("#newDot").hidden = !n; $("#newDot").textContent = n; }
function orderTotal(o){ return o.totals && o.totals.total; }
function renderOrders(){
  const live = orders.filter(o => o.status !== "Cancelled");
  const open = live.filter(o => o.status !== "Completed");
  const toPrint = open.filter(o => ["New","Confirmed","Printing"].includes(o.status)).reduce((s, o) => s + (o.totals?.ornaments || 0), 0);
  const unpaid = live.filter(o => !o.paid).reduce((s, o) => s + (orderTotal(o) || 0), 0);
  const paid = live.filter(o => o.paid).reduce((s, o) => s + (orderTotal(o) || 0), 0);
  const counts = s => s === "Open" ? open.length : s === "All" ? orders.length : orders.filter(o => o.status === s).length;
  let list = ofilter === "All" ? orders : ofilter === "Open" ? open : orders.filter(o => o.status === ofilter);
  if(osearch){ const q = osearch.toLowerCase(); list = list.filter(o => JSON.stringify([o.id, o.customer, o.items.map(itemTitle)]).toLowerCase().includes(q)); }
  $("#tab-orders").innerHTML = `
    <h2 class="title">Orders <button class="btn ghost sm" id="refresh">↻ Refresh</button></h2>
    <p class="sub">New orders land here. Open one to see what to print, then move it along as you go.</p>
    <div class="stats">
      <div class="stat"><b>${open.length}</b><span>Open orders</span></div>
      <div class="stat"><b>${toPrint}</b><span>Ornaments to print</span></div>
      <div class="stat"><b>${money(unpaid)}</b><span>Waiting on payment</span></div>
      <div class="stat"><b>${money(paid)}</b><span>Paid so far</span></div>
    </div>
    <div class="filters">
      ${["Open", ...ORDER_STATUSES, "All"].map(s => `<button class="chip ${ofilter===s?"on":""}" data-f="${s}">${s} (${counts(s)})</button>`).join("")}
      <input class="inp" id="osearch" placeholder="Search name, order no…" value="${esc(osearch)}">
    </div>
    <div id="olist">${list.length ? list.map(orderCard).join("") : `<div class="empty"><img src="elephant.png" alt=""><p>No orders here yet.</p></div>`}</div>`;
  fitNames($("#tab-orders"));
}
function orderCard(o){
  const t = o.totals || {}, isOpen = openIds.has(o.id);
  return `<div class="card order" data-oid="${esc(o.id)}">
    <div class="order-head" data-toggle="${esc(o.id)}">
      <span class="oid">${esc(o.id)}</span>
      <span class="pill st-${esc(o.status)}">${esc(o.status)}</span>
      <span class="pill ${o.paid ? "paid" : "unpaid"}">${o.paid ? "Paid" : "Unpaid"}</span>
      <div class="who">${esc(o.customer?.name)}<small>${fmtDate(o.createdAt)} · ${t.ornaments || 0} ornament${t.ornaments===1?"":"s"} · ${esc(o.delivery)}</small></div>
      <span class="amt">${t.total == null ? "TBC" : money(t.total)}</span>
      <span class="icon-btn">${isOpen ? "▴" : "▾"}</span>
    </div>
    ${isOpen ? `<div class="order-body">
      <div>
        <div class="items">${(o.items||[]).map(i => `<div class="it">${itemSVG(i)}
          <div><h4>${esc(itemTitle(i))}</h4><div class="d">${esc(itemDesc(i))}<br>${esc(itemColours(i))}</div></div>
          <div class="q">× ${i.qty}<div class="d">${i.unitPrice==null ? "TBC" : money(i.unitPrice) + " ea"}</div></div></div>`).join("")}</div>
        <div class="order-actions">
          <button class="btn ghost sm" data-copy="${esc(o.id)}">📋 Copy print list</button>
          <button class="btn ghost sm" data-copyc="${esc(o.id)}">✉️ Copy customer details</button>
        </div>
      </div>
      <div>
        <dl class="kv">
          <dt>Customer</dt><dd>${esc(o.customer?.name)}</dd>
          <dt>Mobile</dt><dd><a href="tel:${esc(o.customer?.phone)}">${esc(o.customer?.phone)}</a></dd>
          <dt>Email</dt><dd><a href="mailto:${esc(o.customer?.email)}">${esc(o.customer?.email)}</a></dd>
          <dt>Delivery</dt><dd>${esc(o.delivery)}${o.address ? "<br>" + esc(o.address).replace(/\n/g,"<br>") : ""}</dd>
          ${o.notes ? `<dt>Their notes</dt><dd>${esc(o.notes)}</dd>` : ""}
        </dl>
        <div class="tot">
          <div class="row"><span>${t.ornaments} ornaments</span><span>${money(t.full)}</span></div>
          ${t.free ? `<div class="row" style="color:var(--red)"><span>Promo (${t.free} free)</span><span>${t.discount==null ? "" : "−" + money(t.discount)}</span></div>` : ""}
          ${o.delivery === "Post" ? `<div class="row"><span>Postage</span><span>${t.postage==null ? "TBC" : money(t.postage)}</span></div>` : ""}
          <div class="row big"><span>Total</span><span>${t.total==null ? "TBC" : money(t.total)}</span></div>
        </div>
        <div class="grid" style="grid-template-columns:1fr auto;margin-top:12px;align-items:end">
          <div><label class="fl">Status</label><select class="inp" data-status="${esc(o.id)}">${ORDER_STATUSES.map(s => `<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>
          <label class="switch" style="padding-bottom:8px"><input type="checkbox" data-paid="${esc(o.id)}" ${o.paid?"checked":""}> Paid</label>
        </div>
        <div style="margin-top:10px"><label class="fl">Your notes (customers never see these)</label><textarea class="inp" data-anotes="${esc(o.id)}" placeholder="Invoice sent, pickup Tuesday…">${esc(o.adminNotes)}</textarea></div>
        <div class="order-actions" style="justify-content:flex-end"><span data-delwrap="${esc(o.id)}"><button class="btn ghost sm" data-delask="${esc(o.id)}">Delete order</button></span></div>
      </div>
    </div>` : ""}
  </div>`;
}
function printList(o){
  return `${o.id} - ${o.customer?.name}\n` + o.items.map(i => `${i.qty} x ${itemDesc(i)}\n   ${itemType(i)==="family" ? (i.names||[]).join(" / ") : '"' + i.name + '"'}\n   Colours: ${itemColours(i)}`).join("\n");
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Copied"); }
  catch(e){ showModal(`<h3 style="margin-bottom:8px">Copy this</h3><textarea class="inp" style="min-height:200px" readonly>${esc(txt)}</textarea><div style="text-align:right;margin-top:10px"><button class="btn" data-mclose>Done</button></div>`); }
}
function showModal(html){ $("#modalHost").innerHTML = `<div class="modal"><div class="card">${html}</div></div>`; }
document.addEventListener("click", e => { if(e.target.closest("[data-mclose]") || e.target.classList.contains("modal")) $("#modalHost").innerHTML = ""; });

$("#tab-orders").addEventListener("click", async e => {
  const t = e.target;
  if(t.closest("[data-f]")){ ofilter = t.closest("[data-f]").dataset.f; return renderOrders(); }
  if(t.id === "refresh"){ await loadOrders(); renderOrders(); return toast("Up to date"); }
  if(t.closest("select,input,textarea,a,button[data-copy],button[data-copyc],[data-delwrap]")){
    const o = id => orders.find(x => x.id === id);
    if(t.dataset.copy) copyText(printList(o(t.dataset.copy)));

function resizeImage(file, max = 600){
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.8)); };
      img.onerror = bad; img.src = r.result; };
    r.onerror = bad; r.readAsDataURL(file);
  });
}
async function moveItem(kind, id, dir){
  const list = CAT[kind], i = list.findIndex(x => x.id === id), j = i + dir;
  if(j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((x, k) => x.sort = k + 1);
  const a = { ...list[i] }, b = { ...list[j] };
  await safe(async () => { await DB.saveItem(kind, a); await DB.saveItem(kind, b); }, "Order updated");
}
